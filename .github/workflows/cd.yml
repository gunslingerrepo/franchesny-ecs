name: "CD - Pulse Service"

on:
  push:
    branches: ["main"]
    paths:
      - 'terraform/**'
      - '.github/workflows/cd.yml'
  # workflow_run:
  #   workflows: ["Build and Push Pulse Images to ECR "]
  #   types: [completed]
  #   branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_ENV_DIR: terraform/envs/prod   


permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::716542960555:role/franchesny-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6" 

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_ENV_DIR }} init

      - name: Terraform plan
        id: plan
        run: terraform -chdir=${{ env.TF_ENV_DIR }} plan -no-color


      - name: Terraform Apply
        #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=${{ env.TF_ENV_DIR }} apply -auto-approve -input=false

